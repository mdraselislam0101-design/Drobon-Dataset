name: ci

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: CI only reads the repository. No write tokens, no releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - run: npm run validate:sources
      - run: npm run validate:corpus
      - run: npm run validate:packs
      - run: npm run validate:assets
      - run: npm run validate:audiences
      - run: npm run validate:cwe
      - run: npm run validate:matrix
      - run: npm run test:vectors
      - run: npm run inventory:check
      - run: npm run test:current-state
      - run: npm run validate:capability-coverage
      - run: npm run originality:check
      - run: npm run eval:coverage
      # Read-only integrity manifest: compute to a tmp file, then verify (G11).
      # Nothing is written inside the repository.
      - run: node scripts/manifest.mjs --scope all --write "$RUNNER_TEMP/integrity.json" && node scripts/manifest.mjs --scope all --check "$RUNNER_TEMP/integrity.json"
